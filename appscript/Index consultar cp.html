<!DOCTYPE html>
<html>

<head>
    <title>Progreso de Ejecución</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        #logs {
            border: 1px solid #ccc;
            padding: 10px;
            max-height: 300px;
            overflow-y: auto;
            background-color: #f9f9f9;
            white-space: pre-wrap;
        }

        #myProgress {
            width: 100%;
            background-color: grey;
            margin-top: 20px;
        }

        #myBar {
            width: 1%;
            height: 30px;
            background-color: green;
            text-align: center;
            line-height: 30px;
            color: white;
        }

        button {
            margin-top: 20px;
            padding: 10px 15px;
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>
    <h1>Progreso de Ejecución</h1>
    <button onclick="startProcess()">Iniciar Proceso</button>
    <div id="myProgress">
        <div id="myBar">0%</div>
    </div>
    <div id="logs">Presiona el botón para iniciar el proceso...</div>

    <script>
        let interval;

        function fetchProgress() {
            google.script.run.withSuccessHandler(updateProgress).getProgressData();
        }

        function updateProgress(data) {
            const total = data.total || 1; // Evitar división por cero
            const encontrados = data.encontrados || 0;
            const porcentaje = Math.round((encontrados / total) * 100);
            const progressBar = document.getElementById('myBar');
            progressBar.style.width = `${porcentaje}%`;
            progressBar.textContent = `${porcentaje}% (${encontrados}/${total})`;
        }

        function fetchLogs() {
            google.script.run
                .withSuccessHandler(function (logs) {
                    const logsDiv = document.getElementById('logs');
                    logsDiv.innerHTML = logs.join("\n");
                    logsDiv.scrollTop = logsDiv.scrollHeight; // Desplaza hacia abajo automáticamente
                })
                .getLogMessages();
        }

        function startProcess() {
            document.getElementById('logs').innerHTML = 'Iniciando proceso...\n';
            document.getElementById('myBar').style.width = '0%';
            document.getElementById('myBar').textContent = '0%';
            google.script.run.buscarPedidosEnSheetsCP();

            if (!interval) {
                interval = setInterval(() => {
                    fetchLogs();
                    fetchProgress();
                }, 5000); // Cada 5 segundo
            }
        }
    </script>
</body>

</html>
